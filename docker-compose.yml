services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      # Loopback-only — reachable at localhost:27017 on the host machine
      # itself, never from the network. Use an SSH tunnel to reach it from
      # elsewhere (e.g. MongoDB Compass on your laptop). This has no auth
      # configured, so it must never be bound to a public interface.
      - "127.0.0.1:27017:27017"

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      MONGO_URI: mongodb://mongo:27017/wedding
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
      PAYMENT_MODE: ${PAYMENT_MODE:-manual}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      PAYSTACK_PUBLIC_KEY: ${PAYSTACK_PUBLIC_KEY:-}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-*}
      PORT: 4000
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_BIND_HOST:-0.0.0.0}:${FRONTEND_PORT:-80}:80"

volumes:
  mongo_data:
  uploads_data:
